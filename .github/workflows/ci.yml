name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_logos_build:
        description: "Run the full Logos dependency/package build"
        required: false
        default: "false"

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run submission preflight
        run: ./scripts/preflight-submission.sh

  nix-fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bootstrap Logos workspace
        run: ./scripts/bootstrap-workspace.sh

      - name: Run fast C++ tests
        run: nix build --impure --no-write-lock-file --recreate-lock-file .#unit-tests-fast -L

  nix-full:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.full_logos_build == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bootstrap Logos workspace
        run: ./scripts/bootstrap-workspace.sh

      - name: Run full Logos module tests
        run: nix build --impure --no-write-lock-file --recreate-lock-file .#unit-tests -L

      - name: Build LGX package
        run: nix build --impure --no-write-lock-file --recreate-lock-file .#lgx-portable -L

  local-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install official Logos v0.2 tools
        run: |
          curl -fsSL https://raw.githubusercontent.com/logos-co/logos-docs/main/resources/scripts/install-node-tools.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install pinned RISC Zero executor
        run: |
          cargo install --locked rzup --version 0.5.0
          rzup install r0vm 3.0.5
          rzup install cargo-risczero 3.0.5
          rzup install rust 1.94.1
          r0vm_path="$HOME/.risc0/extensions/v3.0.5-cargo-risczero-x86_64-unknown-linux-gnu/r0vm"
          test -x "$r0vm_path"
          test "$(cargo risczero --version)" = "cargo-risczero 3.0.5"
          echo "RISC0_SERVER_PATH=$r0vm_path" >> "$GITHUB_ENV"

      - name: Bootstrap Logos workspace
        run: ./scripts/bootstrap-workspace.sh

      - name: Build scaffold CLI
        run: cargo build --release --bin logos-scaffold
        working-directory: ../scaffold

      - name: Prepare released v0.2 modules
        run: |
          mkdir -p .local/ci-e2e
          set -o pipefail
          ./scripts/prepare-v02-runtime.sh 2>&1 | tee .local/ci-e2e/prepare-v02-runtime.log

      - name: Run local two-agent E2E
        env:
          SCAFFOLD_BIN: ../scaffold/target/release/logos-scaffold
          MODULES_DIR: ${{ github.workspace }}/.local/live-modules-v02
        run: ./scripts/ci-local-e2e.sh

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-e2e-evidence
          path: .local/ci-e2e
          if-no-files-found: error
          include-hidden-files: true

      - name: Upload dependency and LGX locks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-dependencies-and-lgx
          path: |
            dependencies-v0.2.json
            .local/dependencies-v0.2.resolved.json
            .local/logos-agent-v020-portable-result/*.lgx
          include-hidden-files: true
